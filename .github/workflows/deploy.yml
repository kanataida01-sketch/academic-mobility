name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Create index.html for GitHub Pages
        run: |
          JS=$(basename .output/public/assets/index-*.js)
          CSS=$(basename .output/public/assets/styles-*.css)
          cat <<EOF > .output/public/index.html
          <!doctype html>
          <html lang="ru">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Academic Mobility</title>
              <link rel="stylesheet" href="./assets/$CSS" />
            </head>
            <body>
              <div id="root"></div>
              <script type="module" src="./assets/$JS"></script>
            </body>
          </html>
          EOF
          cp .output/public/index.html .output/public/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
